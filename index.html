<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>モーツァルト神経衰弱</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:sans-serif;
background:linear-gradient(180deg,#0f172a,#1e293b);
color:#fff;
touch-action:none;
}

.screen{
display:none;
width:100%;
height:100vh;
padding:12px;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.active{
display:flex;
}

h1{
font-size:clamp(28px,6vw,42px);
margin-bottom:12px;
}

p{
line-height:1.6;
margin-bottom:15px;
}

button{
border:none;
border-radius:16px;
background:#fbbf24;
color:#111;
font-weight:bold;
font-size:20px;
padding:16px 28px;
min-width:200px;
cursor:pointer;
}

#hud{
width:min(95vw,520px);
display:flex;
justify-content:space-between;
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

#board{
width:min(95vw,520px);
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.card{
aspect-ratio:1/1;
background:#334155;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
user-select:none;
transition:.2s;
overflow:hidden;
}

.card.open{
background:#fff6d5;
}

.card.matched{
background:#22c55e;
}

.mozart{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:11px;
line-height:1;
color:#111;
}

.face{
font-size:30px;
}

.wig{
font-size:22px;
margin-bottom:-4px;
}

.name{
font-size:8px;
font-weight:bold;
margin-top:2px;
}

.back{
font-size:34px;
}

.orchestra{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:72px;
pointer-events:none;
animation:pop 1s forwards;
z-index:100;
}

.goldMozart{
position:fixed;
left:50%;
top:38%;
transform:translate(-50%,-50%);
font-size:100px;
pointer-events:none;
animation:gold 2s forwards;
z-index:101;
filter:drop-shadow(0 0 20px gold);
}

@keyframes pop{
0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
20%{opacity:1;}
100%{opacity:0;transform:translate(-50%,-50%) scale(1.8);}
}

@keyframes gold{
0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}
20%{opacity:1;}
80%{opacity:1;}
100%{opacity:0;transform:translate(-50%,-50%) scale(2);}
}

.small{
font-size:13px;
margin-top:8px;
opacity:.9;
}

@media (max-width:480px){
.face{
font-size:24px;
}
.wig{
font-size:18px;
}
}
</style>
</head>

<body>

<div id="startScreen" class="screen active">
<h1>🎼 モーツァルト神経衰弱 🎼</h1>

<p>
モーツァルトの顔カードをそろえよう！<br>
同じ顔を2枚見つけるとオーケストラ登場！<br>
さらに金色のモーツァルトが現れることも！<br>
30秒以内に全ペア完成を目指そう！
</p>

<button id="startBtn">スタート</button>
</div>

<div id="gameScreen" class="screen">

<div id="hud">
<div>スコア <span id="score">0</span></div>
<div>残り <span id="time">30</span>秒</div>
</div>

<div id="board"></div>

<div class="small">
タップまたはクリックでカードをめくろう
</div>

</div>

<div id="resultScreen" class="screen">
<h1>結果発表</h1>

<h2 style="margin:12px 0;">
スコア : <span id="finalScore">0</span>
</h2>

<h2 style="margin-bottom:20px;">
ランク : <span id="rank">C</span>
</h2>

<button id="retryBtn">もう一度遊ぶ</button>
</div>

<script>
const mozarts = [
"🎻","🎹","🎺","🎼",
"🎵","🎶","👑","⭐"
];

let deck=[];
let opened=[];
let score=0;
let time=30;
let matched=0;
let lock=false;
let timer=null;

const board=document.getElementById("board");

function shuffle(array){
for(let i=array.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[array[i],array[j]]=[array[j],array[i]];
}
return array;
}

function mozartCard(symbol){
return `
<div class="mozart">
<div class="wig">⚪⚪⚪</div>
<div class="face">🤵</div>
<div>${symbol}</div>
<div class="name">MOZART</div>
</div>
`;
}

function createBoard(){

board.innerHTML="";

deck=shuffle([...mozarts,...mozarts]);

deck.forEach(symbol=>{

const card=document.createElement("div");
card.className="card";

card.dataset.symbol=symbol;

card.innerHTML='<div class="back">🎩</div>';

card.addEventListener("click",flipCard);

board.appendChild(card);

});
}

function startGame(){

score=0;
time=30;
matched=0;
opened=[];
lock=false;

document.getElementById("score").textContent=score;
document.getElementById("time").textContent=time;

document.getElementById("startScreen").classList.remove("active");
document.getElementById("resultScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");

createBoard();

clearInterval(timer);

timer=setInterval(()=>{

time--;

document.getElementById("time").textContent=time;

if(time<=0){
endGame(false);
}

},1000);
}

function flipCard(){

if(lock) return;
if(this.classList.contains("open")) return;
if(this.classList.contains("matched")) return;

this.classList.add("open");
this.innerHTML=mozartCard(this.dataset.symbol);

opened.push(this);

if(opened.length!==2) return;

lock=true;

const a=opened[0];
const b=opened[1];

if(a.dataset.symbol===b.dataset.symbol){

a.classList.add("matched");
b.classList.add("matched");

score+=100;
matched++;

showOrchestra();

if(Math.random()<0.2){
score+=300;
showGoldenMozart();
}

document.getElementById("score").textContent=score;

opened=[];
lock=false;

if(matched===mozarts.length){
endGame(true);
}

}else{

score=Math.max(0,score-10);
document.getElementById("score").textContent=score;

setTimeout(()=>{

a.classList.remove("open");
b.classList.remove("open");

a.innerHTML='<div class="back">🎩</div>';
b.innerHTML='<div class="back">🎩</div>';

opened=[];
lock=false;

},700);
}
}

function showOrchestra(){

const div=document.createElement("div");
div.className="orchestra";
div.textContent="🎻🎺🥁🎹";

document.body.appendChild(div);

setTimeout(()=>{
div.remove();
},1000);
}

function showGoldenMozart(){

const div=document.createElement("div");
div.className="goldMozart";
div.textContent="🌟🤵🌟";

document.body.appendChild(div);

setTimeout(()=>{
div.remove();
},2000);
}

function endGame(clear){

clearInterval(timer);

if(clear){
score+=time*20;
}

document.getElementById("finalScore").textContent=score;

let rank="C";

if(score>=1400){
rank="S";
}else if(score>=1000){
rank="A";
}else if(score>=600){
rank="B";
}

document.getElementById("rank").textContent=rank;

document.getElementById("gameScreen").classList.remove("active");
document.getElementById("resultScreen").classList.add("active");
}

document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("retryBtn").addEventListener("click",startGame);

document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
</script>

</body>
</html>
